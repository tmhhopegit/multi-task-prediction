[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multitask"
version = "1.0.0"
description = "Multi-output vs single-output regression models (multi-task GPs, reduced-rank ridge, multi-task lasso, PLS2) with fair cross-validated comparison"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn>=1.2", "matplotlib", "joblib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["multitask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
